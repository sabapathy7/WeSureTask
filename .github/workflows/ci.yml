name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Approachable Concurrency / Swift 6.2 — Xcode 26.0+
          # Newest 26.x currently on macos-15 runners (not 26.5)
          xcode-version: "26.3"

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project WeSureTask.xcodeproj \
            -scheme WeSureTask \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=26.2' \
            -resultBundlePath TestResults.xcresult \
            | xcbeautify --renderer github-actions
